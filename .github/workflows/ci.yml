name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyGObject and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-glib-2.0 python3-pip
          python3 -m pip install --user pytest ruff
      - name: Lint
        run: python3 -m ruff check .
      - name: Test
        run: python3 -m pytest -q
      - name: Shell scripts and desktop file
        run: |
          bash -n install.sh uninstall.sh
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate conf/*.desktop
      - name: Install into a scratch prefix
        run: |
          ID=io.github.jarrieta86.GoogleWorkspaceSearch
          export DATADIR=/tmp/share LIBEXECDIR=/tmp/bin PROVIDERDIR=/tmp/share/gnome-shell/search-providers
          ./install.sh
          test -x /tmp/bin/gnome-google-workspace-search
          grep -q "Exec=/tmp/bin/gnome-google-workspace-search" /tmp/share/dbus-1/services/$ID.service
          for s in Drive Gmail Calendar Contacts; do
            test -f $PROVIDERDIR/$ID.$s.ini
            test -f /tmp/share/applications/$ID.$s.desktop
            test -f /tmp/share/icons/hicolor/scalable/apps/$ID.$s.svg
          done
          /tmp/bin/gnome-google-workspace-search --help > /dev/null
          ./uninstall.sh
          test ! -e /tmp/bin/gnome-google-workspace-search
          test -z "$(ls $PROVIDERDIR)"
